name: Mobile navigation patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add mobile drawer navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          marker="</style>"
          css=r"""
@media(max-width:860px){
  body{display:block}
  .sidebar{position:fixed!important;left:0;top:0;bottom:0;width:min(82vw,320px);height:100dvh!important;z-index:1001;transform:translateX(-105%);transition:transform .25s ease;overflow-y:auto!important;overflow-x:hidden;box-shadow:0 0 35px rgba(0,0,0,.45)}
  body.nav-open .sidebar{transform:translateX(0)}
  .mobile-menu-btn{display:flex!important;position:fixed;left:12px;top:14px;z-index:1003;width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:rgba(20,23,29,.96);color:var(--text);align-items:center;justify-content:center;font-size:24px;cursor:pointer;box-shadow:var(--shadow)}
  .mobile-menu-overlay{display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.55);backdrop-filter:blur(2px)}
  body.nav-open .mobile-menu-overlay{display:block}
  main,.main,.content{margin-left:0!important;width:100%!important}
}
@media(min-width:861px){.mobile-menu-btn,.mobile-menu-overlay{display:none!important}}
"""
          if ".mobile-menu-btn" not in s:
              s=s.replace(marker,css+marker)
              bodytag="<body>"
              controls='<button class="mobile-menu-btn" type="button" aria-label="Открыть меню" aria-expanded="false">☰</button><div class="mobile-menu-overlay" aria-hidden="true"></div>'
              s=s.replace(bodytag,bodytag+controls,1)
              js=r"""
<script>
(function(){
 const b=document.querySelector('.mobile-menu-btn'), o=document.querySelector('.mobile-menu-overlay'), sb=document.querySelector('.sidebar');
 if(!b||!o||!sb)return;
 const close=()=>{document.body.classList.remove('nav-open');b.setAttribute('aria-expanded','false');b.textContent='☰'};
 const open=()=>{document.body.classList.add('nav-open');b.setAttribute('aria-expanded','true');b.textContent='×'};
 b.addEventListener('click',()=>document.body.classList.contains('nav-open')?close():open());
 o.addEventListener('click',close);
 sb.addEventListener('click',e=>{if(e.target.closest('button,a')&&window.innerWidth<=860)close()});
 window.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
})();
</script>
"""
              s=s.replace("</body>",js+"</body>")
          p.write_text(s,encoding="utf-8")
          PY
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add mobile drawer navigation"
          git push
