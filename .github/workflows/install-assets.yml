name: Install site assets
on:
  push:
    paths:
      - script.js
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link external CSS and JS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          if 'href="style.css"' not in s:
              s=s.replace("</head>",'<link rel="stylesheet" href="style.css?v=2">\n</head>',1)
          if 'src="script.js"' not in s:
              s=s.replace("</body>",'<script src="script.js?v=2"></script>\n</body>',1)
          p.write_text(s,encoding="utf-8")
          PY
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Link standalone site assets"
          git push
