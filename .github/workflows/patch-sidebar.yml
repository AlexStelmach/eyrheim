name: Patch sidebar navigation
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply sidebar fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          old = ".sidebar{position:sticky;top:0;height:100vh;padding:28px 20px;border-right:1px solid var(--line);background:rgba(13,15,20,.97)}"
          new = ".sidebar{position:sticky;top:0;height:100vh;padding:28px 20px;border-right:1px solid var(--line);background:rgba(13,15,20,.97);overflow-y:auto;overflow-x:hidden;scrollbar-gutter:stable}"
          s = s.replace(old, new)
          s = s.replace('<div class="sidebar-foot">Обновлено • персонажи раскрываются по нажатию</div>', '')
          p.write_text(s, encoding="utf-8")
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix sidebar scrolling and remove plot note"
          git push
